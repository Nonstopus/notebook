name: OrangeFox Apollo Android 16

on:
  push:
    branches:
      - orangefox-apollo-build
    paths:
      - '.github/workflows/orangefox-apollo-a16.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y git git-lfs repo aria2 bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib gnupg gperf imagemagick lib32ncurses-dev \
            lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses-dev \
            libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev
          git lfs install
          git config --global user.name github-actions
          git config --global user.email github-actions@github.com

      - name: Sync OrangeFox 16 sources
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/ofx-sync"
          cd "$GITHUB_WORKSPACE/ofx-sync"
          git clone --depth=1 https://github.com/OrangeFox16/sync.git sync
          cd sync
          ./orangefox_sync.sh --branch 16.0 --path "$GITHUB_WORKSPACE/fox_16.0" 2>&1 | tee "$GITHUB_WORKSPACE/sync.log"
          df -h

      - name: Clone exact Apollo tree
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/fox_16.0"
          rm -rf device/xiaomi/apollo
          mkdir -p device/xiaomi/apollo
          cd device/xiaomi/apollo
          git init
          git remote add origin https://github.com/MurtazaKolachi/android_device_xiaomi_umi_TWRP.git
          git fetch --depth=1 origin 6ec913417efa160a9bfe9061b95c6cfeff1faa58
          git checkout --detach FETCH_HEAD

      - name: Adapt device tree to Android 16 build system
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/fox_16.0/device/xiaomi/apollo"
          python3 - <<'PY'
          from pathlib import Path
          import re

          Path("AndroidProducts.mk").write_text("""PRODUCT_MAKEFILES := \\
              $(LOCAL_DIR)/twrp_apollo.mk

          COMMON_LUNCH_CHOICES := \\
              twrp_apollo-ap2a-eng
          """)

          p = Path('BoardConfig.mk')
          s = p.read_text()
          s = re.sub(r'ifdef DECRYPT_PLATFORM_VERSION\nPLATFORM_VERSION := \$\(DECRYPT_PLATFORM_VERSION\)\nelse\nPLATFORM_VERSION := 16\.2\.0\nendif\nPLATFORM_VERSION_LAST_STABLE := \$\(PLATFORM_VERSION\)\n', '', s)
          if 'TW_USE_FBEV2 := true' not in s:
              s += '\n# Android 16 FBEv2\nTW_USE_FBEV2 := true\n'
          if 'TW_INCLUDE_FBE := true' not in s:
              s += 'TW_INCLUDE_FBE := true\n'
          p.write_text(s)

          p = Path('device.mk')
          s = p.read_text()
          s = re.sub(r'\nTWRP_REQUIRED_MODULES \+= miui_prebuilt \\\n\s*magisk_prebuilt\s*\n?', '\n', s)
          p.write_text(s)

          p = Path('fox_apollo.mk')
          s = p.read_text()
          s = '\n'.join(line for line in s.splitlines() if not line.strip().startswith('FOX_VERSION :=')) + '\n'
          if 'OF_FIX_DECRYPTION_ON_DATA_MEDIA' not in s:
              s += '\nOF_FIX_DECRYPTION_ON_DATA_MEDIA := 1\n'
          p.write_text(s)

          # This old tree carries R11-era Magisk flags.  Android 16 does not need
          # them for building recovery and Android's current build system rejects
          # the legacy external/magisk-prebuilt Android.mk.
          p = Path('vendorsetup.sh')
          s = p.read_text()
          s = s.replace('export OF_USE_MAGISKBOOT=1', '# disabled on fox_16.0')
          s = s.replace('export OF_USE_MAGISKBOOT_FOR_ALL_PATCHES=1', '# disabled on fox_16.0')
          s = s.replace('export OF_USE_NEW_MAGISKBOOT=1', '# disabled on fox_16.0')
          p.write_text(s)
          PY

          echo '--- product ---'
          cat AndroidProducts.mk
          echo '--- crypto ---'
          grep -nE 'FBE|FSCRYPT|CRYPTO|METADATA|KEYMASTER' BoardConfig.mk || true

      - name: Remove legacy addons incompatible with Android 16
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/fox_16.0"
          rm -rf external/magisk-prebuilt external/miui-prebuilt
          find external -maxdepth 2 -type f -name Android.mk | grep -Ei 'magisk|miui' || true

      - name: Build recovery
        shell: bash
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE/fox_16.0"
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=apollo
          export OF_FORCE_PREBUILT_KERNEL=1
          export OF_FIX_DECRYPTION_ON_DATA_MEDIA=1
          export OF_DEFAULT_KEYMASTER_VERSION=4.0
          source build/envsetup.sh
          lunch twrp_apollo-ap2a-eng
          mka adbd recoveryimage 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Collect files
        if: always()
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp -v "$GITHUB_WORKSPACE/sync.log" "$GITHUB_WORKSPACE/artifacts/" 2>/dev/null || true
          cp -v "$GITHUB_WORKSPACE/build.log" "$GITHUB_WORKSPACE/artifacts/" 2>/dev/null || true
          OUT="$GITHUB_WORKSPACE/fox_16.0/out/target/product/apollo"
          if [ -d "$OUT" ]; then
            find "$OUT" -maxdepth 1 -type f \( -name 'recovery.img' -o -name 'OrangeFox*.img' -o -name 'OrangeFox*.zip' \) -exec cp -v {} "$GITHUB_WORKSPACE/artifacts/" \;
          fi
          cp -v "$GITHUB_WORKSPACE/fox_16.0/device/xiaomi/apollo/BoardConfig.mk" "$GITHUB_WORKSPACE/artifacts/BoardConfig.used.mk" 2>/dev/null || true
          cp -v "$GITHUB_WORKSPACE/fox_16.0/device/xiaomi/apollo/fox_apollo.mk" "$GITHUB_WORKSPACE/artifacts/fox_apollo.used.mk" 2>/dev/null || true
          cp -v "$GITHUB_WORKSPACE/fox_16.0/device/xiaomi/apollo/AndroidProducts.mk" "$GITHUB_WORKSPACE/artifacts/AndroidProducts.used.mk" 2>/dev/null || true
          df -h || true
          ls -lah "$GITHUB_WORKSPACE/artifacts" || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orangefox-apollo-a16
          path: artifacts/
          retention-days: 2
          if-no-files-found: warn
