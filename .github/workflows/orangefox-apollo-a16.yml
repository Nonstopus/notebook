name: OrangeFox Apollo Android 16

on:
  push:
    branches: [orangefox-apollo-build]
    paths: ['.github/workflows/orangefox-apollo-a16.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y git git-lfs repo bc bison build-essential ccache curl flex g++-multilib gcc-multilib gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev
          git lfs install
          git config --global user.name github-actions
          git config --global user.email github-actions@github.com
          df -h

      - name: Sync OrangeFox 16 sources
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE"
          git clone --depth=1 https://github.com/OrangeFox16/sync.git ofx-sync
          cd ofx-sync
          python3 - <<'PY'
          from pathlib import Path
          p=Path('orangefox_sync.sh')
          s=p.read_text()
          s=s.replace('repo sync;','repo sync -c --force-sync --optimized-fetch --prune --no-clone-bundle --no-tags -j2;')
          p.write_text(s)
          PY
          ./orangefox_sync.sh --branch 16.0 --path "$GITHUB_WORKSPACE/fox_16.0" 2>&1 | tee "$GITHUB_WORKSPACE/sync.log"
          du -sh "$GITHUB_WORKSPACE/fox_16.0" "$GITHUB_WORKSPACE/fox_16.0/.repo" || true
          df -h

      - name: Clone exact Apollo tree
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/fox_16.0"
          rm -rf device/xiaomi/apollo
          git clone https://github.com/MurtazaKolachi/android_device_xiaomi_umi_TWRP.git device/xiaomi/apollo
          cd device/xiaomi/apollo
          git checkout 6ec913417efa160a9bfe9061b95c6cfeff1faa58

      - name: Adapt Apollo tree
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/fox_16.0/device/xiaomi/apollo"
          python3 - <<'PY'
          from pathlib import Path
          import re
          Path('AndroidProducts.mk').write_text('''PRODUCT_MAKEFILES := \\\n              $(LOCAL_DIR)/twrp_apollo.mk\n\nCOMMON_LUNCH_CHOICES := \\\n              twrp_apollo-ap2a-eng\n''')
          p=Path('BoardConfig.mk'); s=p.read_text()
          s=re.sub(r'ifdef DECRYPT_PLATFORM_VERSION\nPLATFORM_VERSION := \$\(DECRYPT_PLATFORM_VERSION\)\nelse\nPLATFORM_VERSION := 16\.2\.0\nendif\nPLATFORM_VERSION_LAST_STABLE := \$\(PLATFORM_VERSION\)\n','',s)
          if 'TW_USE_FBEV2 := true' not in s: s+='\nTW_USE_FBEV2 := true\n'
          if 'TW_INCLUDE_FBE := true' not in s: s+='TW_INCLUDE_FBE := true\n'
          p.write_text(s)
          p=Path('device.mk'); s=p.read_text()
          s=re.sub(r'\nTWRP_REQUIRED_MODULES \+= miui_prebuilt \\\n\s*magisk_prebuilt\s*\n?','\n',s)
          p.write_text(s)
          p=Path('fox_apollo.mk'); s=p.read_text()
          s='\n'.join(x for x in s.splitlines() if not x.strip().startswith('FOX_VERSION :='))+'\n'
          if 'OF_FIX_DECRYPTION_ON_DATA_MEDIA' not in s: s+='OF_FIX_DECRYPTION_ON_DATA_MEDIA := 1\n'
          p.write_text(s)
          p=Path('vendorsetup.sh')
          if p.exists():
              s=p.read_text()
              for v in ['export OF_USE_MAGISKBOOT=1','export OF_USE_MAGISKBOOT_FOR_ALL_PATCHES=1','export OF_USE_NEW_MAGISKBOOT=1']:
                  s=s.replace(v,'# disabled for fox_16.0')
              p.write_text(s)
          PY

      - name: Build recovery
        shell: bash
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE/fox_16.0"
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=apollo
          export OF_FORCE_PREBUILT_KERNEL=1
          export OF_FIX_DECRYPTION_ON_DATA_MEDIA=1
          export OF_DEFAULT_KEYMASTER_VERSION=4.0
          source build/envsetup.sh
          lunch twrp_apollo-ap2a-eng
          mka adbd recoveryimage -j2 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Collect files
        if: always()
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "$GITHUB_WORKSPACE/sync.log" "$GITHUB_WORKSPACE/artifacts/" 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/build.log" "$GITHUB_WORKSPACE/artifacts/" 2>/dev/null || true
          OUT="$GITHUB_WORKSPACE/fox_16.0/out/target/product/apollo"
          if [ -d "$OUT" ]; then
            find "$OUT" -maxdepth 1 -type f \( -name 'recovery.img' -o -name 'OrangeFox*.img' -o -name 'OrangeFox*.zip' \) -exec cp -v {} "$GITHUB_WORKSPACE/artifacts/" \;
          fi
          df -h || true
          ls -lah "$GITHUB_WORKSPACE/artifacts" || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orangefox-apollo-a16
          path: artifacts/
          retention-days: 2
          if-no-files-found: warn
